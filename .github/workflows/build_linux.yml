name: build_linux
run-name: Verify cpp build for linux

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner type to use"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - src/**
      - examples/**
      - tests/**
      - cmake/**
      - python/**
      - scripts/**
      - CMakeLists.txt
      - CMakePresets.json
      - build_lib.sh
      - generate_version.sh
      - .github/workflows/build_linux.yml
  pull_request:
    paths:
      - src/**
      - examples/**
      - tests/**
      - cmake/**
      - python/**
      - scripts/**
      - CMakeLists.txt
      - CMakePresets.json
      - build_lib.sh
      - generate_version.sh
      - .github/workflows/build_linux.yml

concurrency:
  group: mathcore-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      BUILD_DIR: build_ci
      BUILD_TYPE: RelWithDebInfo
      ENABLE_TBB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' && 'OFF' || 'ON' }}
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.runner == 'github-hosted' }}
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ ccache libeigen3-dev libtbb-dev python3-dev python3-pytest doxygen graphviz

      - name: Validate self-hosted prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' }}
        run: |
          command -v cmake
          command -v ninja
          command -v g++
          command -v ccache
          command -v python3
          python3 -m pytest --version

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mathcore-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-mathcore-${{ runner.os }}-${{ github.ref_name }}-
            ccache-mathcore-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B "${BUILD_DIR}" -GNinja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DENABLE_TESTS=ON \
            -DENABLE_TBB="${ENABLE_TBB}" \
            -DENABLE_CUDA=OFF \
            -DENABLE_OPENGL=OFF \
            -DCPU_ENABLE_NATIVE_TUNING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel 4

      - name: Test
        run: ctest --test-dir "${BUILD_DIR}" --output-on-failure --parallel 2 --no-tests=error

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
