name: build_docs_pages
run-name: Build and publish template documentation

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages after building docs"
        required: true
        default: false
        type: boolean
  push:
    branches: [main, master, develop]
    paths:
      - README.md
      - src/**
      - doc/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/docs_pages.yml
  pull_request:
    branches: [main, master, develop]
    paths:
      - README.md
      - src/**
      - doc/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/docs_pages.yml

permissions:
  contents: read

concurrency:
  group: mathcore-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install documentation dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ doxygen graphviz libeigen3-dev

      - name: Configure documentation
        run: cmake --preset docs

      - name: Build documentation
        run: cmake --build --preset docs

      - name: Verify generated documentation
        run: |
          test -f build_docs/doc/html/index.html
          test -d build_docs/doc/xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build_docs/doc/html

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
